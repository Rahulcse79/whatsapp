{{- if .Values.coturn.enabled }}
# One coturn per media node (DaemonSet on the pool), host-network so each node's
# public IP is a TURN endpoint. ~10-20% of calls relay through here; TURN/TCP-443
# is the hostile-network last resort (rtc-lld §1).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}-coturn
  labels:
    {{- include "wa-rtc.labels" . | nindent 4 }}
    app.kubernetes.io/name: coturn
spec:
  selector:
    matchLabels:
      {{- include "wa-rtc.selector" (dict "instance" .Release.Name "name" "coturn") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wa-rtc.labels" . | nindent 8 }}
        app.kubernetes.io/name: coturn
      annotations:
        checksum/config: {{ .Files.Get "templates/coturn-configmap.yaml" | sha256sum }}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- include "wa-rtc.nodePool" . | nindent 6 }}
      securityContext:
        runAsNonRoot: false # binds the privileged TLS port :443
      containers:
        - name: coturn
          image: {{ .Values.coturn.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["turnserver"]
          args:
            - "-c"
            - "/etc/coturn/turnserver.conf"
            - "--static-auth-secret=$(TURN_STATIC_AUTH_SECRET)"
          env:
            - name: TURN_STATIC_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.coturn.authSecret }}
                  key: TURN_STATIC_AUTH_SECRET
          ports:
            - name: turn-udp
              containerPort: {{ .Values.coturn.listeningPort }}
              protocol: UDP
            - name: turn-tcp
              containerPort: {{ .Values.coturn.listeningPort }}
              protocol: TCP
            - name: turns-tcp
              containerPort: {{ .Values.coturn.tlsListeningPort }}
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: {{ .Values.coturn.listeningPort }}
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            {{- toYaml .Values.coturn.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"] # bind :443
          volumeMounts:
            - name: config
              mountPath: /etc/coturn
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-coturn
{{- end }}
