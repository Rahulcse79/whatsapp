# WhatsApp V2 — local dev / single-box pilot stack (HLD §17.5 Profile A/B seed)
# Usage:  make dev-up            (core infra)
#         make dev-up-all        (+ observability + offline-profile services)
# Data persists in named volumes; `make dev-clean` wipes everything.

name: whatsapp-v2

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-whatsapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-whatsapp}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-whatsapp}"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--maxmemory", "1gb", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.11-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"   # client
      - "8222:8222"   # monitoring
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb -p local/media local/backups local/wal-archive &&
      echo 'buckets ready'"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

  # ── offline profile (HLD §17.5): self-hosted push / OTP / CA ──────────────

  # Media edge cache (T15.04): validates the HMAC token media-svc mints, pulls
  # from MinIO on a miss, caches immutable E2EE ciphertext, and passes Range
  # through so video plays progressively. Opt-in — media-svc only points clients
  # here when WA_CDN_BASE_URL/WA_CDN_SIGNING_KEY are set.
  media-cdn:
    image: nginx:1.27-alpine
    depends_on:
      minio:
        condition: service_healthy
    environment:
      # Must equal media-svc's WA_CDN_SIGNING_KEY.
      CDN_SIGNING_KEY: ${WA_CDN_SIGNING_KEY:-dev-edge-signing-key}
      MINIO_BUCKET: ${MINIO_BUCKET:-media}
    ports:
      - "8088:8088"
    volumes:
      # Main context first: `load_module` for njs is only valid there, so the
      # server block cannot load it from conf.d.
      - ./config/cdn/nginx-main.conf:/etc/nginx/nginx.conf:ro
      - ./config/cdn/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ./config/cdn/verify.js:/etc/nginx/njs/verify.js:ro
      - cdncache:/var/cache/nginx/media
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8088/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  ntfy:
    profiles: ["offline"]
    image: binwiederhier/ntfy:latest
    command: ["serve", "--cache-file", "/var/cache/ntfy/cache.db"]
    ports:
      - "8090:80"
    volumes:
      - ntfycache:/var/cache/ntfy

  # Email OTP relay: a local SMTP catcher (mailhog) for the pilot — SMTP on 1025,
  # web UI on 8025. Real deployments point WA_SMTP_HOST at Postfix/Stalwart:587.
  # Set WA_OTP_CHANNEL=email, WA_SMTP_HOST=smtp, WA_SMTP_PORT=1025 to use it.
  smtp:
    profiles: ["offline"]
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  # Private CA (step-ca): ACME-compatible, so cert-manager config barely changes.
  # The DOCKER_STEPCA_INIT_* vars run a non-interactive first init; the CA root is
  # then pre-installed on enrolled devices (offline-local-server.md §2).
  step-ca:
    profiles: ["offline"]
    image: smallstep/step-ca:latest
    environment:
      DOCKER_STEPCA_INIT_NAME: WhatsApp V2 Offline CA
      DOCKER_STEPCA_INIT_DNS_NAMES: ca.wa.internal,localhost
      DOCKER_STEPCA_INIT_ACME: "true"
    ports:
      - "9000:9000"
    volumes:
      - stepca:/home/step

  # ── observability profile ─────────────────────────────────────────────────
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:latest
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus

  loki:
    profiles: ["observability"]
    image: grafana/loki:3.4.1
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - lokidata:/loki

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-dev}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "3000:3000"
    volumes:
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    # Tempo (traces) + provisioned dashboards land with task T0.23.

volumes:
  cdncache:
  pgdata:
  natsdata:
  miniodata:
  ntfycache:
  stepca:
  promdata:
  lokidata:
  grafanadata:
