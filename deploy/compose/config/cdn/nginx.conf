# Media edge cache (T15.04) — a reference CDN in front of MinIO.
#
# What it does:
#   1. validates the HMAC token media-svc mints (internal/media/domain/cdn.go),
#   2. on a miss, pulls the object from MinIO over the private network,
#   3. caches it — media blobs are E2EE ciphertext and immutable once complete,
#      so they are ideal cache objects and the edge never sees plaintext,
#   4. passes Range requests through, which is what makes progressive video
#      playback work.
#
# This is deliberately a plain nginx so a self-hosted deployment has a working
# edge out of the box. A managed CDN slots in the same way: point it at MinIO as
# origin and configure its own token-auth with the same shared secret, or let it
# cache in front of this nginx.
#
# The token: ?e=<unix expiry>&s=<base64url HMAC-SHA256(key "\n" expiry)>
# nginx's built-in secure_link uses MD5, which we do not want, so verification
# runs in njs (verify.js) against the same construction the Go side signs.

js_import /etc/nginx/njs/verify.js;

# Cache lives on disk: ciphertext is immutable, so a large, long-lived cache is
# both safe and effective. inactive is high because a popular attachment should
# survive quiet periods.
proxy_cache_path /var/cache/nginx/media
                 levels=1:2
                 keys_zone=media_cache:64m
                 max_size=10g
                 inactive=7d
                 use_temp_path=off;

upstream minio_origin {
    server minio:9000;
    keepalive 32;
}

server {
    listen 8088;
    server_name _;

    # Blobs are large; never buffer a whole object into memory before serving.
    proxy_buffering on;
    proxy_max_temp_file_size 0;

    # The signing key is substituted from the environment by the image's
    # entrypoint (templates/*.template -> conf.d) so it never lives in the
    # image. It must equal WA_CDN_SIGNING_KEY on media-svc.
    set $cdn_signing_key "${CDN_SIGNING_KEY}";

    location /media/ {
        # ── 1. Authorise ────────────────────────────────────────────────────
        # verify.js returns "1" for a valid, unexpired token and "0" otherwise.
        js_set $token_ok verify.checkToken;
        if ($token_ok != "1") {
            return 403;
        }

        # ── 2. Cache key ────────────────────────────────────────────────────
        # Deliberately excludes the query string: two clients with different
        # (equally valid) tokens for the same object must share one cache entry.
        # The Range header IS part of the key so partial responses stay correct.
        proxy_cache media_cache;
        proxy_cache_key "$uri$http_range";
        proxy_cache_valid 200 206 7d;
        proxy_cache_valid 404 1m;
        # One origin fetch for a thundering herd on the same new object.
        proxy_cache_lock on;
        proxy_cache_lock_timeout 20s;
        # Keep serving during an origin blip — ciphertext does not go stale.
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        add_header X-Cache-Status $upstream_cache_status always;

        # ── 3. Origin pull ──────────────────────────────────────────────────
        # Strip the client's token before going to the origin and address MinIO
        # directly.
        #
        # ORIGIN AUTH — read this before deploying. nginx cannot sign S3 SigV4
        # requests, so the edge cannot authenticate to a private bucket on its
        # own. The bucket must therefore grant read access to the edge and to
        # nothing else. Do that with a MinIO bucket policy scoped to the edge's
        # source network, e.g.
        #
        #   mc anonymous set-json ./origin-policy.json local/media
        #
        # using origin-policy.json in this directory. Confidentiality does not
        # rest on that policy — the objects are E2EE ciphertext under
        # unguessable keys — but the policy is what keeps the origin from being
        # an open bucket, and the edge token is what enforces per-object access.
        rewrite ^/media/(.*)$ /$1 break;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_pass_request_headers on;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Range passthrough — the reason progressive playback works at all.
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_force_ranges on;

        proxy_pass http://minio_origin/$MINIO_BUCKET/;

        # ── 4. Client caching ───────────────────────────────────────────────
        # Immutable ciphertext: let the browser keep it too. The URL's own token
        # expiry still bounds when a *new* fetch may start.
        add_header Cache-Control "private, max-age=86400, immutable" always;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
