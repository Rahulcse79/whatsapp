# Release — triggered by pushing a version tag (e.g. `git tag v0.1.0 && git push --tags`).
# Builds everything ON GITHUB (nothing local by policy):
#   • backend binaries (linux amd64/arm64), version-stamped via -ldflags
#   • Android APK + iOS archive (skipped automatically until clients/mobile exists)
#   • a GitHub Release with versioned filenames attached
#
# Artifact naming: whatsapp-v2-<component>-<version>-<os>-<arch>[.ext]
# App versioning: versionName = tag; versionCode/build number = GitHub run number.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release

env:
  VERSION: ${{ github.ref_name }}

jobs:
  # ── detect what exists so app jobs skip gracefully pre-T0.18 ─────────────
  detect:
    runs-on: ubuntu-latest
    outputs:
      has_mobile: ${{ steps.check.outputs.has_mobile }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f clients/mobile/app.json ] || [ -f clients/mobile/app.config.ts ]; then
            echo "has_mobile=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_mobile=false" >> "$GITHUB_OUTPUT"
            echo "clients/mobile has no Expo app yet (arrives at task T0.18) — app jobs skipped."
          fi

  # ── backend binaries ──────────────────────────────────────────────────────
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: server/go.sum

      - name: Build version-stamped binaries
        working-directory: server
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          VER="${VERSION#v}"
          mkdir -p ../dist
          for CMD in core-api ws-gateway media-svc notification-svc; do
            go build -trimpath \
              -ldflags "-s -w -X main.version=${VER} -X main.commit=${GITHUB_SHA::7}" \
              -o "../dist/whatsapp-v2-${CMD}-${VER}-linux-${{ matrix.goarch }}" \
              "./cmd/${CMD}"
          done
          ls -la ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: backend-linux-${{ matrix.goarch }}
          path: dist/*

  # ── Android APK (Expo prebuild → Gradle), versioned filename ─────────────
  android:
    needs: detect
    if: needs.detect.outputs.has_mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install workspace
        working-directory: clients
        run: pnpm install --no-frozen-lockfile

      - name: Generate native Android project (Expo prebuild)
        working-directory: clients/mobile
        env:
          APP_VERSION: ${{ github.ref_name }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: npx expo prebuild --platform android --no-install

      # Signing: provide these repo secrets for store-ready builds —
      #   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      #   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
      # Without them the APK is debug-signed (installable for testing only).
      - name: Restore keystore (if secrets configured)
        if: ${{ vars.ANDROID_SIGNING == 'true' }}
        working-directory: clients/mobile/android
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Build APK
        working-directory: clients/mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Version-stamped filename
        run: |
          VER="${VERSION#v}"
          mkdir -p dist
          cp clients/mobile/android/app/build/outputs/apk/release/*.apk \
             "dist/whatsapp-v2-${VER}-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk

  # ── iOS build (unsigned archive; TestFlight needs Apple cert secrets) ────
  ios:
    needs: detect
    if: needs.detect.outputs.has_mobile == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workspace
        working-directory: clients
        run: pnpm install --no-frozen-lockfile

      - name: Generate native iOS project (Expo prebuild)
        working-directory: clients/mobile
        env:
          APP_VERSION: ${{ github.ref_name }}
          IOS_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          npx expo prebuild --platform ios --no-install
          cd ios && pod install

      # Unsigned archive: proves the app builds; installing on devices /
      # TestFlight requires Apple Developer signing secrets (see .github/README.md).
      - name: Build (unsigned archive)
        working-directory: clients/mobile/ios
        run: |
          xcodebuild archive \
            -workspace *.xcworkspace \
            -scheme "$(xcodebuild -list -json | python3 -c 'import json,sys;print(json.load(sys.stdin)["workspace"]["schemes"][0])')" \
            -configuration Release \
            -archivePath build/app.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Version-stamped filename
        run: |
          VER="${VERSION#v}"
          mkdir -p dist
          ditto -c -k --keepParent clients/mobile/ios/build/app.xcarchive \
            "dist/whatsapp-v2-${VER}-ios-unsigned.xcarchive.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-archive
          path: dist/*.zip

  # ── GitHub Release with all versioned artifacts ───────────────────────────
  release:
    needs: [detect, backend, android, ios]
    if: always() && needs.backend.result == 'success' && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: WhatsApp V2 ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
