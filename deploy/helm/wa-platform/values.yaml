# Structural per-deployable defaults (binding specs, kubernetes-deployment.md §2).
# Env-specific bits (WA_ENV, infra endpoints, image tags, secrets, scaling) come
# from values-<env>.yaml, which Helm deep-merges over these.

# ── platform bootstrap (umbrella-level) ─────────────────────────────────────
bootstrap:
  # DB role/grant Job (pre-install/pre-upgrade hook). Points psql at the admin
  # DSN in a Secret and applies least-privilege GRANTs per service role.
  dbRoles:
    enabled: true
    image: postgres:17-alpine
    adminSecret: wa-pg-admin # Secret with key WA_PG_ADMIN_DSN

# offline profile only (values-offline.yaml flips this on): a private step-ca +
# a cert-manager ACME ClusterIssuer so TLS works with no public CA (§17.5).
offline:
  stepCA:
    enabled: false
    image: smallstep/step-ca:latest
    dnsName: ca.wa.internal
    acmeIssuerName: wa-step-ca

# ── core-api ────────────────────────────────────────────────────────────────
core-api:
  enabled: true
  nameOverride: core-api
  image:
    repository: ghcr.io/whatsapp-v2/core-api
  replicaCount: 2
  ports: { http: 8080, grpc: 9090 }
  resources:
    requests: { cpu: "1", memory: 2Gi }
    limits: { cpu: "4", memory: 8Gi }
  autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 6, targetCPUUtilizationPercentage: 70 }
  pdb: { enabled: true, minAvailable: 1 }
  config:
    WA_HTTP_ADDR: ":8080"
    WA_GRPC_ADDR: ":9090"
  envFromSecret: wa-core-api-secrets

# ── ws-gateway (drains on rollout: §4) ──────────────────────────────────────
ws-gateway:
  enabled: true
  nameOverride: ws-gateway
  image:
    repository: ghcr.io/whatsapp-v2/ws-gateway
  replicaCount: 3
  ports: { http: 8080, grpc: 0 }
  resources:
    requests: { cpu: "1", memory: 2Gi }
    limits: { cpu: "2", memory: 4Gi }
  # maxUnavailable 0 + long grace so no connection is dropped mid-drain.
  rollout:
    maxSurge: 1
    maxUnavailable: 0
    scaleDownDelaySeconds: 120
    canary:
      steps:
        - setWeight: 10
        - pause: { duration: 120 }
        - setWeight: 50
        - pause: { duration: 120 }
  # /drain flips readiness off and emits ServerHint{DRAIN} to live conns; clients
  # reconnect over a 60–120 s jitter window (websocket-protocol §1, LLD §5).
  lifecycle:
    preStop:
      httpGet:
        path: /drain
        port: 8080
  terminationGracePeriodSeconds: 150
  autoscaling: { enabled: true, minReplicas: 3, maxReplicas: 15, targetCPUUtilizationPercentage: 65 }
  pdb: { enabled: true, minAvailable: 2 }
  config:
    WA_HTTP_ADDR: ":8080"
  envFromSecret: wa-ws-gateway-secrets

# ── media-svc ───────────────────────────────────────────────────────────────
media-svc:
  enabled: true
  nameOverride: media-svc
  image:
    repository: ghcr.io/whatsapp-v2/media-svc
  replicaCount: 2
  ports: { http: 8080, grpc: 0 }
  resources:
    requests: { cpu: "500m", memory: 1Gi }
    limits: { cpu: "2", memory: 4Gi }
  autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 6, targetCPUUtilizationPercentage: 70 }
  pdb: { enabled: true, minAvailable: 1 }
  config:
    WA_HTTP_ADDR: ":8080"
  envFromSecret: wa-media-svc-secrets

# ── notification-svc (NATS worker) ──────────────────────────────────────────
notification-svc:
  enabled: true
  nameOverride: notification-svc
  image:
    repository: ghcr.io/whatsapp-v2/notification-svc
  replicaCount: 2
  ports: { http: 8080, grpc: 0 }
  resources:
    requests: { cpu: "500m", memory: 512Mi }
    limits: { cpu: "1", memory: 2Gi }
  # Scales on JetStream push.dispatch queue depth (external metric adapter);
  # CPU as the floor here, queue-depth metric added per env.
  autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 8, targetCPUUtilizationPercentage: 60 }
  pdb: { enabled: true, minAvailable: 1 }
  config:
    WA_HTTP_ADDR: ":8080"
  envFromSecret: wa-notification-svc-secrets
