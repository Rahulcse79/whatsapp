{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "wa-service.fullname" . }}
  labels:
    {{- include "wa-service.labels" . | nindent 4 }}
spec:
  # Default-deny: with no ingress/egress rules the pod is isolated; overlays add
  # the explicit allow matrix (kubernetes-deployment.md §5).
  podSelector:
    matchLabels:
      {{- include "wa-service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  {{- with .Values.networkPolicy.ingress }}
  ingress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.networkPolicy.egress }}
  egress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
