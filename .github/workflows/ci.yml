# CI — runs on every commit/PR. Nothing runs on developer machines by policy:
# all checks live here. Pipeline contract: Docs/08-devops/ci-cd.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Go backend: build, vet, race tests, lint ─────────────────────────────
  backend:
    name: backend (go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: server/go.sum

      # Generated code (internal/proto/gen) is never committed: every Go
      # compile is preceded by codegen, so drift is impossible (T0.12).
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Generate protobuf code
        working-directory: server/proto
        run: buf generate

      - name: Build all deployables
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Tests (race detector)
        run: go test -race ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          # Pinned (not `latest`) — a floating version silently enabling stricter
          # staticcheck once turned CI red across many green commits.
          version: v2.12.2
          working-directory: server

  # ── Protobuf contracts: lint, breaking-change gate, codegen proof ────────
  proto:
    name: proto (buf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the breaking-change check

      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Lint
        working-directory: server/proto
        run: buf lint

      - name: Breaking-change check (PRs, against main)
        if: github.event_name == 'pull_request'
        working-directory: server/proto
        run: buf breaking --against '../../.git#branch=origin/main,subdir=server/proto'

      - name: Generate (Go + TS) — proves codegen stays green
        working-directory: server/proto
        run: buf generate

      # Convenience artifact for inspecting generated code — NOT a gate (the
      # `buf generate` step above is the real verification). Never fail the
      # job on it: GitHub artifact-storage quota is account-wide and transient.
      - name: Upload generated code
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: proto-gen-${{ github.sha }}
          retention-days: 1
          path: |
            server/internal/proto/gen/
            clients/packages/proto-types/src/gen/

  # ── Clients: shared packages typecheck + tests ───────────────────────────
  clients:
    name: clients (ts)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: pnpm install --no-frozen-lockfile # switch to --frozen-lockfile once pnpm-lock.yaml is committed

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Tests
        run: pnpm -r test

  # ── Migrations round-trip + adapter integration tests (PostgreSQL 17 + Valkey) ─
  migrations:
    name: migrations (postgres 17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: whatsapp
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: whatsapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_URL: postgres://whatsapp:ci@localhost:5432/whatsapp?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - name: Apply all up migrations
        run: >
          docker run --rm --network host
          -v ${{ github.workspace }}/server/migrations:/migrations
          migrate/migrate:v4.18.1
          -path=/migrations -database "$DB_URL" up

      - name: Down migrations must fully revert
        run: >
          docker run --rm --network host
          -v ${{ github.workspace }}/server/migrations:/migrations
          migrate/migrate:v4.18.1
          -path=/migrations -database "$DB_URL" down -all

      - name: Re-apply from zero (round trip is clean)
        run: >
          docker run --rm --network host
          -v ${{ github.workspace }}/server/migrations:/migrations
          migrate/migrate:v4.18.1
          -path=/migrations -database "$DB_URL" up

      - name: Sanity — partitioned inbox exists with 16 partitions
        run: |
          docker run --rm --network host postgres:17-alpine \
            psql "$DB_URL" -tAc \
            "SELECT count(*) FROM pg_inherits WHERE inhparent = 'message_inbox'::regclass" \
            | grep -qx '16'

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: server/go.sum

      # Adapters import generated protobuf types; regenerate before compiling
      # (gen/ is never committed — see the backend job).
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Generate protobuf code
        working-directory: server/proto
        run: buf generate

      - name: Adapter integration tests (against the migrated DB + Valkey)
        working-directory: server
        env:
          WA_TEST_PG_DSN: postgres://whatsapp:ci@localhost:5432/whatsapp?sslmode=disable
          WA_TEST_VALKEY_ADDR: localhost:6379
        run: go test ./internal/.../adapters/... -run Integration -v

  # ── Deploy: Helm charts lint + render clean for every env (no cluster) ───
  deploy:
    name: deploy (helm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Lint the reusable service chart
        run: helm lint deploy/helm/wa-service

      - name: Lint the RTC chart (host-network media plane)
        run: helm lint deploy/helm/wa-rtc

      - name: Resolve umbrella dependencies
        run: helm dependency update deploy/helm/wa-platform

      - name: Lint the umbrella
        run: helm lint deploy/helm/wa-platform

      - name: Render every environment overlay
        run: |
          set -euo pipefail
          mkdir -p /tmp/rendered
          for env in dev staging prod offline; do
            echo "::group::helm template ($env)"
            helm template "wa-$env" deploy/helm/wa-platform \
              --namespace "wa-$env" \
              -f deploy/helm/wa-platform/values.yaml \
              -f "deploy/helm/wa-platform/values-$env.yaml" \
              > "/tmp/rendered/$env.yaml"
            echo "  platform: $(grep -c '^kind:' "/tmp/rendered/$env.yaml") resources"
            helm template "wa-rtc-$env" deploy/helm/wa-rtc \
              --namespace "wa-$env" \
              -f deploy/helm/wa-rtc/values.yaml \
              -f "deploy/helm/wa-rtc/values-$env.yaml" \
              > "/tmp/rendered/rtc-$env.yaml"
            echo "  rtc: $(grep -c '^kind:' "/tmp/rendered/rtc-$env.yaml") resources"
            echo "::endgroup::"
          done

      - name: Validate rendered core resources (kubeconform; CRDs skipped)
        run: |
          set -euo pipefail
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          for env in dev staging prod offline; do
            ./kubeconform -ignore-missing-schemas -summary "/tmp/rendered/$env.yaml"
            ./kubeconform -ignore-missing-schemas -summary "/tmp/rendered/rtc-$env.yaml"
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML parser
        run: pip install --quiet pyyaml

      - name: ArgoCD + observability config valid (YAML parse + dashboards JSON)
        run: |
          python3 - <<'PY'
          import glob, json, yaml
          for f in glob.glob("deploy/argocd/**/*.yaml", recursive=True):
              list(yaml.safe_load_all(open(f))); print("argocd ok", f)
          for f in glob.glob("ops/dashboards/*.json"):
              json.load(open(f)); print("dashboard json ok", f)
          for f in glob.glob("ops/alerts/*.yaml") + glob.glob("ops/synthetic/*.yaml") + glob.glob("ops/dashboards/*.yaml") + glob.glob("ops/chaos/*.yaml"):
              list(yaml.safe_load_all(open(f))); print("ops yaml ok", f)
          PY

  # ── Security: dependency/stdlib CVEs (govulncheck) + secret scan (gitleaks) ─
  # Complements gosec (SAST via golangci in the backend job). Closes the
  # "deps + secrets" half of the go-live checklist §2 security row.
  security:
    name: security (deps + secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the full history, not just the tip

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: server/go.sum

      # govulncheck runs in source mode, so the tree must compile → generate
      # protobuf first, exactly like the backend job.
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Generate protobuf code
        working-directory: server/proto
        run: buf generate

      - name: govulncheck (Go module + stdlib CVEs)
        working-directory: server
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Secret scan (gitleaks, full history)
        run: |
          set -euo pipefail
          VER=8.18.4
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar xz gitleaks
          ./gitleaks detect --source . --redact --no-banner --verbose

  # ── Docs-contract gate: interface changes require their doc (PRs only) ───
  docs-contract:
    name: docs contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: API/schema changes must update their docs
        run: |
          set -euo pipefail
          base="origin/${{ github.base_ref }}"
          changed="$(git diff --name-only "$base"...HEAD)"
          fail=0
          if grep -q '^server/proto/' <<<"$changed" && ! grep -q '^Docs/04-api/' <<<"$changed"; then
            echo "::error::Proto contracts changed without updating Docs/04-api/ — the docs ARE the contract (ci-cd.md §2)."
            fail=1
          fi
          if grep -q '^server/migrations/' <<<"$changed" && ! grep -qE '^(Docs/03-database/|server/migrations/README.md)' <<<"$changed"; then
            echo "::error::Migrations changed without updating Docs/03-database/ (or the deviations list in migrations/README.md)."
            fail=1
          fi
          exit $fail
