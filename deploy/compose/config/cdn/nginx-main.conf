# Main nginx context for the media edge (T15.04).
#
# This file exists for one reason: `load_module` is only valid in the main
# context, so the njs module cannot be loaded from a conf.d snippet. The server
# block itself stays a template under /etc/nginx/templates so the official
# image's entrypoint can substitute environment variables into it before start.

load_module modules/ngx_http_js_module.so;

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" cache=$upstream_cache_status';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # Large immutable blobs: never buffer a whole object to disk before serving,
    # and let the client take its time on a slow link.
    client_max_body_size 0;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    include /etc/nginx/conf.d/*.conf;
}
