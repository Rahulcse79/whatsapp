# Synthetic probe (monitoring-logging-tracing.md §5): an external-vantage check
# run every 60 s. This shell version verifies the gateway + core-api are serving
# and pushes synthetic_probe_success to the Pushgateway. The full two-client
# round trip (WS connect → send → deliver → receipt, emitting msg_e2e_latency)
# lands with the headless protocol test client (T0.24).
apiVersion: v1
kind: ConfigMap
metadata:
  name: synthetic-probe
  labels:
    app.kubernetes.io/part-of: whatsapp-v2
    app.kubernetes.io/component: synthetic-probe
data:
  probe.sh: |
    #!/bin/sh
    set -eu
    ok=1
    curl -fsS -m 5 "$WA_PROBE_GATEWAY_URL/healthz" >/dev/null || ok=0
    curl -fsS -m 5 "$WA_PROBE_CORE_API_URL/readyz" >/dev/null || ok=0
    printf 'synthetic_probe_success %s\n' "$ok" \
      | curl -fsS -m 5 --data-binary @- "$WA_PUSHGATEWAY_URL/metrics/job/synthetic-probe"
    [ "$ok" = "1" ]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: synthetic-probe
  labels:
    app.kubernetes.io/part-of: whatsapp-v2
    app.kubernetes.io/component: synthetic-probe
spec:
  schedule: "* * * * *" # every minute (K8s CronJob minimum granularity)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 40
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/component: synthetic-probe
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
          containers:
            - name: probe
              image: curlimages/curl:8.11.1
              command: ["sh", "/probe/probe.sh"]
              env:
                - name: WA_PROBE_GATEWAY_URL
                  value: http://ws-gateway:8080
                - name: WA_PROBE_CORE_API_URL
                  value: http://core-api:8080
                - name: WA_PUSHGATEWAY_URL
                  value: http://pushgateway:9091
              volumeMounts:
                - name: script
                  mountPath: /probe
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: synthetic-probe
                defaultMode: 0555
