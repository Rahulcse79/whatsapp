{{- if .Values.offline.stepCA.enabled }}
# Offline private CA (smallstep step-ca) + a cert-manager ACME ClusterIssuer, so
# TLS works with no public CA in the air-gapped profile (HLD §17.5). Enabled only
# by values-offline.yaml.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-step-ca
  labels:
    app.kubernetes.io/part-of: whatsapp-v2
    app.kubernetes.io/component: step-ca
spec:
  selector:
    app.kubernetes.io/component: step-ca
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: https
      port: 9000
      targetPort: 9000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-step-ca
  labels:
    app.kubernetes.io/part-of: whatsapp-v2
    app.kubernetes.io/component: step-ca
spec:
  serviceName: {{ .Release.Name }}-step-ca
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: step-ca
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: step-ca
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: step-ca
          image: {{ .Values.offline.stepCA.image | quote }}
          ports:
            - name: https
              containerPort: 9000
          volumeMounts:
            - name: step
              mountPath: /home/step
  volumeClaimTemplates:
    - metadata:
        name: step
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.offline.stepCA.acmeIssuerName }}
  labels:
    app.kubernetes.io/part-of: whatsapp-v2
    app.kubernetes.io/component: step-ca
spec:
  acme:
    server: https://{{ .Release.Name }}-step-ca.{{ .Release.Namespace }}.svc:9000/acme/acme/directory
    email: admin@{{ .Values.offline.stepCA.dnsName }}
    privateKeySecretRef:
      name: {{ .Values.offline.stepCA.acmeIssuerName }}-account-key
    solvers:
      - http01:
          ingress:
            class: envoy
{{- end }}
