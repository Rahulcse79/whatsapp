# dev: a single media node, so one LiveKit (required anti-affinity keeps a
# second replica Pending on a 1-node pool) and lighter resources.
livekit:
  replicas: 1
  resources:
    requests: { cpu: "500m", memory: 512Mi }
    limits: { cpu: "2", memory: 2Gi }
  pdb:
    enabled: false
coturn:
  realm: rtc.dev.wa
  resources:
    requests: { cpu: "250m", memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }
